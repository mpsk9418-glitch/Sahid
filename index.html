<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#22c55e"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="EARNING MONEY CLINER">
<title>EARNING MONEY CLINER</title>
<style>
:root{color-scheme:dark;--bg:#0a110c;--card:#15211a;--card2:#1d2d23;--g:#22c55e;--g2:#16a34a;--y:#facc15;--t:#f1f5f2;--m:#8aa396;--r:#ef4444;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{background:var(--bg);color:var(--t);max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:76px}
h1,h2,h3{font-weight:800}
.top{padding:18px 16px 8px;display:flex;justify-content:space-between;align-items:center}
.pad{padding:8px 16px}
.card{background:var(--card);border-radius:16px;padding:14px;margin:10px 0}
.bal{background:linear-gradient(135deg,#15803d,#22c55e);color:#04210f;border-radius:20px;padding:20px;margin:10px 0}
.bal b{font-size:38px;display:block}
.btn{background:var(--g);color:#04210f;border:0;border-radius:12px;padding:12px 16px;font-weight:800;font-size:15px;cursor:pointer}
.btn.s{padding:7px 10px;font-size:12px;border-radius:9px}
.btn.o{background:var(--card2);color:var(--t)}.btn.d{background:var(--r);color:#fff}.btn.y{background:var(--y)}
input,select{width:100%;background:#0f1a13;border:1px solid #2a3d31;color:var(--t);padding:12px;border-radius:12px;font-size:15px;margin:5px 0}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.game{background:var(--card);border-radius:16px;padding:14px;text-align:center}
.game .ic{font-size:40px}.game small{color:var(--y);display:block;margin:4px 0 8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tx{padding:10px 0;border-bottom:1px solid #223127}
.plus{color:var(--g)}.minus{color:var(--r)}
.muted{color:var(--m);font-size:13px}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#0f1a13;display:flex;border-top:1px solid #223127;padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;border:0;color:var(--m);font-size:12px;padding:6px;cursor:pointer}
nav button.on{color:var(--g);font-weight:800}nav i{display:block;font-size:20px;font-style:normal}
.tag{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--card2)}
.tag.banned{background:#7f1d1d}.tag.blacklisted{background:#78350f}
.cimg{display:block;max-width:100%;max-height:220px;border-radius:10px;margin-bottom:4px;cursor:zoom-in}
.msg{max-width:80%;padding:9px 12px;border-radius:14px;margin:6px 0;font-size:14px}
.me{background:var(--g);color:#04210f;margin-left:auto}.them{background:var(--card2)}
.chat{height:46vh;overflow-y:auto;display:flex;flex-direction:column}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:0 16px 6px}
.tabs button{white-space:nowrap}
.ov{position:fixed;inset:0;background:#000c;display:flex;align-items:center;justify-content:center;z-index:9}
.ov .box{background:var(--card);border-radius:20px;padding:22px;width:88%;max-width:360px;text-align:center}
.tap{font-size:56px;width:150px;height:150px;border-radius:50%;border:0;background:var(--g);margin:14px 0;cursor:pointer}
#toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--y);color:#222;padding:10px 16px;border-radius:12px;font-weight:700;z-index:99;display:none}
.amt{width:90px;padding:7px;margin:0}
.glow{color:#facc15;text-shadow:0 0 18px #22c55e}.bar{height:8px;background:#1d2d23;border-radius:8px;margin:26px 40px 8px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--g);animation:ld 2s forwards}@keyframes ld{to{width:100%}}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}.quick button{background:var(--card);border:0;border-radius:14px;padding:10px 0;color:var(--t);font-size:12px}.quick i{display:block;font-size:24px;font-style:normal}
.banner{background:linear-gradient(120deg,#4c1d95,#7c3aed);border-radius:16px;padding:16px;margin:12px 0;display:flex;justify-content:space-between;align-items:center}.banner span{font-size:48px}
.inst{position:sticky;top:0;z-index:8;display:flex;align-items:center;gap:8px;background:linear-gradient(90deg,#15803d,#22c55e);color:#04210f;padding:8px 12px;font-weight:700;font-size:14px}.inst span{flex:1}
@keyframes ksh{0%,100%{transform:translateX(0)}15%{transform:translateX(-7px)}35%{transform:translateX(7px)}55%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes wpour{0%{transform:translateY(-18px) rotate(0deg)}35%,75%{transform:translateY(-34px) rotate(calc(var(--d)*80deg))}100%{transform:translateY(-18px) rotate(0deg)}}
</style></head><body>
